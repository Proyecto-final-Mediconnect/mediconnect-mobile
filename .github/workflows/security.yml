name: Security

# Controles de seguridad que promete el Sprint 0 (§4.8.1 y §5.5.5, ENG-166):
#
#   - Auditoría de dependencias de producción en cada PR y en main: falla con
#     una vulnerabilidad high o critical. Las moderadas no frenan, pero quedan
#     en el log y Dependabot abre el PR para subirlas.
#   - Escaneo de secretos (gitleaks) sobre los commits del PR: falla si alguien
#     commitea una clave, un token o una contraseña.
#
# Va en un workflow aparte y no como steps de `CI` para no cambiar los checks
# que exige el ruleset: se suman como checks nuevos sin tocar los existentes.
on:
  push:
    branches:
      - 'release/**'
      - 'main'
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Solo lectura: los jobs hacen checkout, audit y gitleaks, no escriben nada.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependencias (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Solo las de producción: lo que termina en la app. `npm audit` lee el
      # lockfile, no hace falta instalar. Las moderadas no frenan; Dependabot
      # abre el PR para subirlas.
      - name: npm audit --omit=dev --audit-level=high
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secretos (gitleaks)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Hace falta la historia para escanear solo los commits del PR.
          fetch-depth: 0

      # El binario y no la action oficial: la action pide una licencia paga en
      # repos de organizaciones. Se escanean solo los commits del PR (base..head),
      # con los secretos tapados en el log. Imagen fijada por digest (v8.21.2).
      # Los SHAs entran por `env` y no interpolados en el script, y se usa el SHA
      # de la base en vez de `origin/<rama>` para que ande igual en PRs apiladas.
      - name: gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            git /repo --redact --verbose \
            --log-opts="${BASE_SHA}..${HEAD_SHA}"
